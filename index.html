<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corryong Cup Waypoints</title>
  </head>
  <body class="bg-background text-foreground">
    <div id="app">
      <!-- Header -->
      <header class="h-14 border-b border-border flex items-center px-4 shrink-0">
        <!-- Hamburger menu (mobile only) -->
        <button
          id="menu-toggle"
          class="btn-icon-ghost md:hidden mr-2"
          aria-label="Toggle waypoint list"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"/>
            <line x1="4" x2="20" y1="6" y2="6"/>
            <line x1="4" x2="20" y1="18" y2="18"/>
          </svg>
        </button>
        <h1 class="text-lg font-semibold">Corryong Cup Waypoints</h1>
      </header>

      <!-- Main content area -->
      <div class="flex flex-1 min-h-0 relative">
        <!-- Sidebar / Waypoint list -->
        <aside
          id="waypoint-panel"
          class="
            w-72 border-r border-border bg-background shrink-0 flex flex-col
            md:relative md:translate-x-0
            absolute inset-y-0 left-0 z-10 transform -translate-x-full transition-transform duration-200 ease-in-out
          "
          aria-label="Waypoint list"
        >
          <div class="p-4 border-b border-border shrink-0">
            <input
              type="text"
              id="waypoint-search"
              class="input w-full"
              placeholder="Search waypoints..."
            />
          </div>
          <div id="waypoint-list" class="flex-1 overflow-y-auto scrollbar">
            <!-- Waypoints will be rendered here -->
          </div>
        </aside>

        <!-- Map container -->
        <div id="map" class="flex-1"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
